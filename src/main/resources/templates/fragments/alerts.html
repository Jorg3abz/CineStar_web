<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- 📢 TOASTS - Contenedor fijo en esquina SUPERIOR IZQUIERDA
       (Así no tapan el carrito que se abre desde la derecha) -->
  <div th:fragment="toasts" 
       class="toast-container position-fixed p-3" 
       style="top: 80px; left: 20px; z-index: 1090;">

    <!-- 🔴 TOAST DE ERROR: Login requerido (PERSISTENTE - 6 segundos) -->
    <div th:if="${error == 'no_autenticado'}" 
         class="toast custom-glass-toast" 
         data-toast-delay="6000"
         role="alert">
      <div class="toast-header bg-transparent border-0 text-white">
        <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
        <strong class="me-auto">Acceso requerido</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body">
        <p class="mb-2">Debes iniciar sesión para agregar productos al carrito</p>
        <div class="mt-2">
          <button class="btn btn-sm btn-outline-light me-2" onclick="openModal()">🔑 Iniciar Sesión</button>
        </div>
      </div>
    </div>

    <!-- 🔴 TOAST DE ERROR: Stock insuficiente (5 segundos) -->
    <div th:if="${error == 'stock_insuficiente' or error == 'stock_agotado'}" 
         class="toast custom-glass-toast" 
         data-toast-delay="5000"
         role="alert">
      <div class="toast-header bg-transparent border-0 text-white">
        <i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>
        <strong class="me-auto">Sin stock</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body">
        <p class="mb-0" th:text="${mensajeError != null ? mensajeError : 'No hay stock suficiente'}">Error</p>
      </div>
    </div>

    <!-- 🔴 TOAST DE ERROR: Otros errores (4 segundos) -->
    <div th:if="${error != null and error != 'no_autenticado' and error != 'stock_insuficiente' and error != 'stock_agotado'}" 
         class="toast custom-glass-toast" 
         data-toast-delay="4000"
         role="alert">
      <div class="toast-header bg-transparent border-0 text-white">
        <i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>
        <strong class="me-auto">Error</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body">
        <p class="mb-0" th:text="${mensajeError != null ? mensajeError : 'Ha ocurrido un error'}">Error</p>
      </div>
    </div>

    <!-- 🟢 TOAST DE ÉXITO RÁPIDO: Agregado al carrito (2 segundos - no molesta) -->
    <div th:if="${exito == 'independiente' or exito == 'vinculado'}" 
         class="toast custom-glass-toast" 
         data-toast-delay="2000"
         role="alert">
      <div class="toast-header bg-transparent border-0 text-white">
        <i class="bi bi-check-circle-fill text-success me-2"></i>
        <strong class="me-auto">Agregado</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body">
        <p class="mb-0" th:text="${mensajeExito != null ? mensajeExito : 'Producto agregado al carrito'}">Éxito</p>
      </div>
    </div>

    <!-- 🟢 TOAST DE ÉXITO MEDIO: Eliminado (3 segundos) -->
    <div th:if="${exito == 'eliminado' or exito == 'vaciado'}" 
         class="toast custom-glass-toast" 
         data-toast-delay="3000"
         role="alert">
      <div class="toast-header bg-transparent border-0 text-white">
        <i class="bi bi-check-circle-fill text-success me-2"></i>
        <strong class="me-auto">Listo</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body">
        <p class="mb-0" th:text="${mensajeExito != null ? mensajeExito : 'Operación exitosa'}">Éxito</p>
      </div>
    </div>

  </div>

</body>
</html>
