<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">

  <!-- Meta Tags Optimizados para SEO y Mobile -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
  <meta name="description" content="CineStar - Tu mejor experiencia cinematográfica"/>
  <meta name="theme-color" content="#0a0a0f"/>
  
  <title th:text="${title} + ' - CineStar'">CineStar</title>

  <!-- Preconnect para optimizar carga de recursos externos -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <!-- Bootstrap 5.3.2 (CSS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

  <!-- Fuentes (con display=swap para evitar FOIT - Flash of Invisible Text) -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <!-- CSS Personalizado (Nueva estructura limpia) -->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" th:href="@{/css/public.css}"/>

</head>
</html>
