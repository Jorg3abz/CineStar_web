<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="scripts">
    
    <!-- 1. Bootstrap 5.3.2 JS Bundle (base) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. SweetAlert2 (modales elegantes) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- 3. Inicialización de Toasts (del flujo anterior) -->
    <script>
      (function() {
        'use strict';
        
        function initToasts() {
          var toastElements = document.querySelectorAll('.toast.custom-glass-toast');
          toastElements.forEach(function(toastEl) {
            var delay = parseInt(toastEl.getAttribute('data-toast-delay')) || 4000;
            var bsToast = new bootstrap.Toast(toastEl, { autohide: true, delay: delay });
            bsToast.show();
            setTimeout(function() {
              if (toastEl.classList.contains('show')) {
                toastEl.classList.add('hiding');
                setTimeout(function() {
                  toastEl.classList.remove('show');
                  toastEl.classList.add('hide');
                  toastEl.style.display = 'none';
                }, 300);
              }
            }, delay);
          });
        }
        
        function restoreScroll() {
          var savedPosition = sessionStorage.getItem('scrollPosition');
          if (savedPosition) {
            window.scrollTo(0, parseInt(savedPosition));
            sessionStorage.removeItem('scrollPosition');
          }
        }
        
        document.addEventListener('submit', function(e) {
          if (e.target && e.target.tagName === 'FORM') {
            sessionStorage.setItem('scrollPosition', window.scrollY.toString());
          }
        }, true);
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            restoreScroll();
            initToasts();
          });
        } else {
          restoreScroll();
          initToasts();
        }
      })();
    </script>

    <!-- 4. Módulo Confitería - Orden: utils → validacion → checkout -->
    <script th:src="@{/js/productos/utils.js}"></script>
    <script th:src="@{/js/productos/validacion.js}"></script>
    <script th:src="@{/js/productos/checkout.js}"></script>

  </div>
</body>
</html>
