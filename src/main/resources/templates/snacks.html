<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Confitería')}"></head>
<body class="bg-dark text-white">
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="container snacks-main-container">
    
    <!-- Header de la sección -->
    <header class="text-center mb-5">
        <span class="snack-category-label">CineStar Premium</span>
        <h1 class="snack-main-title">NUESTROS SNACKS</h1>
        <p class="text-muted mt-2">El acompañamiento perfecto para tu película</p>
    </header>
    
    <!-- Grid de Productos -->
    <div class="row g-4">
        <article class="col-md-6 col-lg-4" 
                 th:each="producto : ${listaProductos}"
                 th:id="'producto-' + ${producto.idProducto}">
            <div class="card glass-snack-card h-100">
                <!-- Imagen -->
                <div class="img-wrapper bg-secondary d-flex align-items-center justify-content-center">
                    <span style="font-size: 3rem; opacity: 0.3;">🍿</span>
                </div>
                
                <div class="card-body d-flex flex-column p-4">
                    <h2 class="snack-item-title mb-2 h5" th:text="${producto.nombreProducto}">Nombre</h2>
                    <p class="snack-item-desc small mb-3 flex-grow-1" th:text="${producto.descripcion != null ? producto.descripcion : 'El acompañamiento perfecto para tu película.'}">Descripción</p>
                    
                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <span class="snack-item-price" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
                        
                        <!-- Formulario Backend Puro -->
                        <form th:action="@{/snacks/agregar}" method="POST" class="m-0">
                            <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>
                            <button type="submit" class="btn-glass-add" title="Agregar al carrito" aria-label="Agregar producto al carrito">
                                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                    
                    <!-- Indicador de stock bajo -->
                    <small th:if="${producto.stock != null and producto.stock <= 5}" class="text-warning mt-2">
                        <i class="bi bi-exclamation-triangle"></i> Solo quedan <span th:text="${producto.stock}">X</span> unidades
                    </small>
                </div>
            </div>
        </article>
    </div>
  </main>

  <!-- Footer Global -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <!-- Toasts (AL FINAL del body, position: fixed) -->
  <div th:replace="~{fragments/alerts :: toasts}"></div>

  <!-- Scripts de Bootstrap -->
  <div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
